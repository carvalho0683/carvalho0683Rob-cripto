<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Robô Cripto">
<link rel="manifest" href="./manifest.json">
<title>Robô Cripto – Simulação</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:760px;margin-inline:auto}
h1{font-size:26px;margin:8px 0 2px}.muted{color:#6b7280;font-size:12px}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 2px 12px #00000010}
.grid,.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#f9fafb;border-radius:13px;padding:11px}.metric small{color:#6b7280}.metric b{display:block;font-size:18px;margin-top:3px}
button{border:0;border-radius:13px;padding:12px 8px;min-height:46px;background:#111827;color:#fff;font-weight:700;font-size:14px}.secondary{background:#e5e7eb;color:#111827}.danger{background:#991b1b}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.badge{font-size:11px;background:#e5e7eb;border-radius:10px;padding:5px 8px}.warning{background:#fff7ed;font-size:12px;color:#7c2d12}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:250px;overflow:auto;margin-bottom:0}
</style>
</head>
<body>
<h1>🤖 Robô Cripto</h1><div class="muted">V2 • SIMULAÇÃO • R$ 200 inicial</div>
<div class="card warning"><b>Modo seguro.</b> Nenhuma ordem real é enviada. Esta versão é para validar o fluxo e a gestão de risco.</div>
<div class="card"><div class="grid">
<div class="metric"><small>CAIXA</small><b id="cash"></b></div><div class="metric"><small>PATRIMÔNIO</small><b id="equity"></b></div>
<div class="metric"><small>RESULTADO</small><b id="pnl"></b></div><div class="metric"><small>POSIÇÕES</small><b id="pos"></b></div>
</div></div>
<div class="card"><b>Mercado</b><div id="market"></div></div>
<div class="card"><b>Controles</b><div class="actions">
<button onclick="analyze()">📊 Analisar</button><button onclick="tick()">🔄 Atualizar</button>
<button onclick="buy('BTC')">🟢 Comprar BTC</button><button onclick="buy('ETH')">🟢 Comprar ETH</button>
<button onclick="buy('SOL')">🟢 Comprar SOL</button><button onclick="closeAll()" class="danger">⛔ Encerrar tudo</button>
<button onclick="showHistory()" class="secondary">📜 Histórico</button><button onclick="resetApp()" class="secondary">♻️ Resetar</button>
</div><p class="muted">R$ 50 máx./operação • Stop 5% • Alvo 8% • Máximo 2 posições.</p></div>
<div class="card"><b>Posições abertas</b><div id="open"></div></div>
<div class="card"><b>Histórico recente</b><pre id="log"></pre></div>
<script>
const C={initial:200,maxTrade:50,maxPos:2,stop:.05,take:.08};
const seed={BTC:105000,ETH:5600,SOL:820};
let s=JSON.parse(localStorage.getItem("roboCryptoSimV2")||"null");
if(!s)s={cash:C.initial,prices:{...seed},positions:{},history:[],signals:{}};
function save(){localStorage.setItem("roboCryptoSimV2",JSON.stringify(s))}
function brl(x){return Number(x).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function equity(){return s.cash+Object.entries(s.positions).reduce((v,[a,p])=>v+p.qty*s.prices[a],0)}
function addLog(t){s.history.unshift(new Date().toLocaleString("pt-BR")+" — "+t);s.history=s.history.slice(0,100);save();render()}
function render(){
cash.textContent=brl(s.cash);document.getElementById("equity").textContent=brl(equity());pnl.textContent=brl(equity()-C.initial);pos.textContent=Object.keys(s.positions).length+"/"+C.maxPos;
market.innerHTML=["BTC","ETH","SOL"].map(a=>`<div class="row"><span><b>${a}-BRL</b><br><small>${brl(s.prices[a])}</small></span><span class="badge">${s.signals[a]||"—"}</span></div>`).join("");
open.innerHTML=Object.entries(s.positions).map(([a,p])=>`<div class="row"><span><b>${a}</b><br><small>Entrada ${brl(p.entry)} • qtd ${p.qty.toFixed(8)}</small></span><span><b>${brl(p.qty*s.prices[a])}</b><br><small>SL ${brl(p.stop)} • TP ${brl(p.take)}</small></span></div>`).join("")||'<span class="muted">Nenhuma posição aberta.</span>';
log.textContent=s.history.slice(0,20).join("\n");
}
function tick(){for(const a of Object.keys(s.prices)){const d=(Math.random()-.49)*(a==="BTC"?.012:.018);s.prices[a]=Math.max(1,s.prices[a]*(1+d))}
for(const [a,p] of Object.entries({...s.positions})){const px=s.prices[a];if(px<=p.stop){sell(a,"STOP");continue}if(px>=p.take){sell(a,"ALVO");continue}if(px>=p.entry*1.05)p.stop=Math.max(p.stop,px*.97)}save();render()}
function analyze(){for(const a of ["BTC","ETH","SOL"]){const r=Math.random();s.signals[a]=r>.64?"COMPRA":r<.30?"VENDA":"AGUARDAR"}addLog("Análise: "+Object.entries(s.signals).map(x=>x[0]+" "+x[1]).join(" | "))}
function buy(a){if(s.positions[a])return addLog("Compra ignorada: posição já aberta em "+a);if(Object.keys(s.positions).length>=C.maxPos)return addLog("Compra bloqueada: máximo de posições.");const amount=Math.min(C.maxTrade,s.cash);if(amount<5)return addLog("Compra bloqueada: caixa insuficiente.");const px=s.prices[a];s.cash-=amount;s.positions[a]={qty:amount/px,entry:px,stop:px*(1-C.stop),take:px*(1+C.take),invested:amount};addLog("COMPRA SIMULADA "+a+" por "+brl(amount)+" @ "+brl(px))}
function sell(a,reason){const p=s.positions[a];if(!p)return;const gross=p.qty*s.prices[a],profit=gross-p.invested;s.cash+=gross;delete s.positions[a];addLog("VENDA "+a+" ("+reason+") | P/L "+brl(profit))}
function closeAll(){Object.keys(s.positions).forEach(a=>sell(a,"ENCERRAMENTO"))}
function showHistory(){alert(s.history.slice(0,40).join("\n")||"Sem operações.")}
function resetApp(){if(confirm("Apagar dados e voltar para R$ 200?")){localStorage.removeItem("roboCryptoSimV2");location.reload()}}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
render();setInterval(tick,15000);
</script></body></html>
